query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id          # variant ID
          product {
            id        # product ID
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
  shop {
    # Existing metafield
    customDiscountSettings: metafield(
      namespace: "volume_discount_settings"
      key: "product_volume_rules"
    ) {
      type
      value
    }

    # New metafield (cart_discount_namespace.cart_discount_key)
    cartDiscountSettings: metafield(
      namespace: "cart_discount_namespace"
      key: "cart_discount_key"
    ) {
      type
      value
    }
  }
}